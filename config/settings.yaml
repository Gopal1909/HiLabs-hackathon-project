# ── Scope filter ───────────────────────────────────────────────────────────────
target_state: "CA"
target_market_types:
  - "large_group"
  - "small_group"
  - "individual"     # keep; filter further by issuer/brand
target_brands:
  - "Health Net"     # Primary CA commercial brand
  - "Ambetter"       # Secondary; Ambetter from Health Net in CA

# ── URL normalization ─────────────────────────────────────────────────────────
# Rules applied in order before deduplication:
# 1. Strip trailing slash
# 2. Decode %20 → space, then re-encode to canonical percent-encoding
# 3. Lowercase scheme and host only (path is case-sensitive on S3/Azure)
# 4. Drop query-string parameters: utm_*, source, ref
url_strip_params:
  - "utm_source"
  - "utm_medium"
  - "utm_campaign"
  - "ref"
  - "source"

# ── HTTP settings ─────────────────────────────────────────────────────────────
http_timeout_seconds: 60
http_chunk_size: 65536
user_agent: "CentenePTDParser/1.0 (HiLabs-Hackathon; contact: hackathon@example.com)"
max_retries: 3
retry_backoff_factor: 2

# ── Output paths (relative to project root) ───────────────────────────────────
outputs_dir: "outputs"
raw_data_dir: "data/raw"
processed_data_dir: "data/processed"
logs_dir: "logs"

plan_index_csv: "outputs/plan_index.csv"
unique_rate_files_csv: "outputs/unique_rate_files.csv"
index_parsing_summary_json: "outputs/index_parsing_summary.json"

# ── Phase 2 (C2) Outputs & Settings ──────────────────────────────────────────
reports_dir: "reports"
ppo_plan_candidates_csv: "outputs/ppo_plan_candidates.csv"
ppo_network_files_csv: "outputs/ppo_network_files.csv"
c2_evidence_log_csv: "outputs/c2_evidence_log.csv"
c2_summary_json: "outputs/c2_summary.json"
c2_ppo_logic_md: "reports/c2_ppo_logic.md"

c2_thresholds:
  confirmed: 0.85
  probable: 0.65
  uncertain: 0.40

c2_known_issuers:
  health_net_ca_hios: "67138"
  health_net_ca_small_group_ppo_product: "67138CA073"

# ── Caching ───────────────────────────────────────────────────────────────────
# When true, skip re-downloading index files if already present in data/raw/
use_cached_index: false

